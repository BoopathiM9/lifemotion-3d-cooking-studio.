<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LifeMotion AI Kids - Dosa Scene</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      font-family: "Arial", sans-serif;
      background: linear-gradient(180deg, #fff7ea 0%, #ffe4b8 100%);
    }

    .title {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      color: #8c3b1c;
      text-shadow: 0 2px 0 rgba(255,255,255,0.5);
    }

    .subtitle {
      position: absolute;
      top: 72px;
      width: 100%;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #d26d2b;
    }

    .caption {
      position: absolute;
      left: 80px;
      bottom: 26px;
      width: 1120px;
      background: rgba(88, 48, 28, 0.95);
      color: white;
      border-radius: 24px;
      padding: 18px 28px;
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    svg {
      position: absolute;
      inset: 0;
    }
  </style>
</head>
<body>
  <div class="title">LifeMotion AI Kids</div>
  <div class="subtitle">Cute Cooking Animation - Masala Dosa</div>
  <div class="caption" id="caption">Welcome! Let's make a yummy Masala Dosa!</div>

  <svg width="1280" height="720" viewBox="0 0 1280 720">

    <!-- BACKGROUND -->
    <defs>
      <linearGradient id="wallGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#fff8ef"/>
        <stop offset="100%" stop-color="#ffe7c5"/>
      </linearGradient>
      <linearGradient id="counterGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#d59a6f"/>
        <stop offset="100%" stop-color="#b87249"/>
      </linearGradient>
      <linearGradient id="panGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#4b5458"/>
        <stop offset="100%" stop-color="#22282b"/>
      </linearGradient>
      <linearGradient id="shirtGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f1f1f1"/>
      </linearGradient>
      <linearGradient id="apronGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#ff7f50"/>
        <stop offset="100%" stop-color="#e95c2b"/>
      </linearGradient>
      <linearGradient id="dosaGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#f7da8b"/>
        <stop offset="100%" stop-color="#dfae52"/>
      </linearGradient>
    </defs>

    <!-- wall -->
    <rect x="0" y="0" width="1280" height="720" fill="url(#wallGrad)"/>

    <!-- window -->
    <rect x="905" y="145" width="250" height="165" rx="18" fill="#d8f1fb" stroke="#ffffff" stroke-width="8"/>
    <rect x="930" y="170" width="200" height="115" fill="#91d8f7"/>
    <line x1="1030" y1="170" x2="1030" y2="285" stroke="#ffffff" stroke-width="10"/>
    <line x1="930" y1="227" x2="1130" y2="227" stroke="#ffffff" stroke-width="10"/>

    <!-- shelves -->
    <rect x="760" y="110" width="120" height="14" rx="7" fill="#b97a54"/>
    <circle cx="790" cy="96" r="20" fill="#9cd36a"/>
    <rect x="835" y="72" width="20" height="38" rx="6" fill="#f7c66c"/>

    <rect x="140" y="130" width="150" height="14" rx="7" fill="#b97a54"/>
    <circle cx="180" cy="112" r="20" fill="#8fd06d"/>
    <rect x="228" y="92" width="22" height="38" rx="5" fill="#8ecaf0"/>

    <!-- counter -->
    <rect x="0" y="490" width="1280" height="230" fill="url(#counterGrad)"/>
    <rect x="0" y="485" width="1280" height="14" fill="#9a603f"/>

    <!-- PAN -->
    <g id="pan">
      <rect x="930" y="442" width="170" height="18" rx="9" fill="#2f3538"/>
      <ellipse cx="760" cy="430" rx="220" ry="70" fill="#2d3336"/>
      <ellipse cx="760" cy="420" rx="198" ry="54" fill="url(#panGrad)"/>
    </g>

    <!-- DOSA -->
    <g id="dosaGroup">
      <ellipse id="dosa" cx="760" cy="418" rx="45" ry="14" fill="#fdf7ea" stroke="#eadcc8" stroke-width="4"/>
      <ellipse id="dosaRing1" cx="760" cy="418" rx="0" ry="0" fill="none" stroke="#e6b768" stroke-width="4" opacity="0.55"/>
      <ellipse id="dosaRing2" cx="760" cy="418" rx="0" ry="0" fill="none" stroke="#c98a42" stroke-width="3" opacity="0.3"/>
    </g>

    <!-- MASALA -->
    <g id="masala" opacity="0">
      <ellipse cx="780" cy="405" rx="42" ry="20" fill="#efc64f"/>
      <circle cx="760" cy="400" r="10" fill="#d6a131"/>
      <circle cx="790" cy="397" r="9" fill="#d6a131"/>
      <circle cx="805" cy="410" r="8" fill="#d6a131"/>
      <circle cx="772" cy="414" r="7" fill="#d6a131"/>
      <circle cx="798" cy="403" r="4" fill="#69a84f"/>
      <circle cx="764" cy="407" r="4" fill="#69a84f"/>
    </g>

    <!-- STEAM -->
    <g id="steam" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0">
      <path d="M700 380 Q680 345 700 315 Q720 285 698 255"/>
      <path d="M760 375 Q735 338 760 305 Q782 275 760 245"/>
      <path d="M820 382 Q798 345 822 315 Q845 285 822 252"/>
    </g>

    <!-- PLATE -->
    <g id="plateArea" opacity="0">
      <ellipse cx="1075" cy="510" rx="120" ry="34" fill="#ffffff" stroke="#d4d4d4" stroke-width="8"/>
      <path id="servedDosa" d="M990 495 Q1040 455 1110 482 Q1140 494 1152 510 Q1115 526 1000 520 Q985 510 990 495Z"
            fill="url(#dosaGrad)" stroke="#c88e3d" stroke-width="4"/>
      <circle cx="960" cy="504" r="24" fill="#f8f8f8" stroke="#cfcfcf" stroke-width="5"/>
      <circle cx="1180" cy="504" r="24" fill="#d97c2d" stroke="#b65a14" stroke-width="5"/>
    </g>

    <!-- CHEF -->
    <g id="chef">

      <!-- body -->
      <g id="body">
        <path d="M175 356 Q245 315 315 356 L338 550 H152Z" fill="url(#shirtGrad)" stroke="#e2e2e2" stroke-width="4"/>
        <path d="M210 380 Q245 360 280 380 L292 550 H198Z" fill="url(#apronGrad)"/>
        <rect x="220" y="392" width="50" height="60" rx="12" fill="#fff4ea" opacity="0.18"/>
        <circle cx="245" cy="408" r="6" fill="#ffffff"/>
        <circle cx="245" cy="438" r="6" fill="#ffffff"/>
        <circle cx="245" cy="468" r="6" fill="#ffffff"/>
      </g>

      <!-- neck -->
      <rect x="228" y="214" width="34" height="28" rx="8" fill="#f0b27a"/>

      <!-- face -->
      <ellipse cx="245" cy="190" rx="72" ry="78" fill="#f2b47f"/>
      <ellipse cx="214" cy="190" rx="12" ry="18" fill="#ffffff"/>
      <ellipse cx="276" cy="190" rx="12" ry="18" fill="#ffffff"/>
      <circle cx="214" cy="192" r="7" fill="#2d241e"/>
      <circle cx="276" cy="192" r="7" fill="#2d241e"/>
      <circle cx="217" cy="189" r="2.5" fill="#ffffff"/>
      <circle cx="279" cy="189" r="2.5" fill="#ffffff"/>
      <path d="M238 207 Q245 214 252 207" fill="none" stroke="#c77e4f" stroke-width="3" stroke-linecap="round"/>
      <path d="M218 228 Q245 248 273 228" fill="none" stroke="#9a3d3a" stroke-width="6" stroke-linecap="round"/>
      <circle cx="193" cy="215" r="9" fill="#f3a6a1" opacity="0.65"/>
      <circle cx="297" cy="215" r="9" fill="#f3a6a1" opacity="0.65"/>

      <!-- hair -->
      <path d="M175 182 Q180 122 246 120 Q314 122 318 182 Q301 146 268 141 Q246 134 224 142 Q191 145 175 182Z" fill="#4a2c1d"/>

      <!-- hat -->
      <g id="hat">
        <path d="M182 132 Q156 95 187 72 Q200 35 240 60 Q248 26 284 54 Q325 38 326 82 Q348 99 316 132Z"
              fill="#ffffff" stroke="#e5e5e5" stroke-width="4"/>
        <rect x="184" y="126" width="124" height="26" rx="9" fill="#ffffff" stroke="#ececec" stroke-width="3"/>
      </g>

      <!-- left arm -->
      <g id="leftArm">
        <path d="M165 378 Q112 408 120 470" stroke="#ffffff" stroke-width="34" fill="none" stroke-linecap="round"/>
        <circle cx="120" cy="470" r="16" fill="#f0b27a"/>
      </g>

      <!-- right arm -->
      <g id="rightArm" transform="translate(312 368) rotate(18)">
        <path d="M0 0 Q58 18 112 62" stroke="#ffffff" stroke-width="34" fill="none" stroke-linecap="round"/>
        <circle cx="112" cy="62" r="16" fill="#f0b27a"/>
        <!-- ladle handle -->
        <path d="M118 67 L170 100" stroke="#8f6a49" stroke-width="10" stroke-linecap="round"/>
        <!-- ladle spoon -->
        <ellipse cx="179" cy="107" rx="20" ry="10" fill="#cfd5da" stroke="#99a2a8" stroke-width="3"/>
      </g>
    </g>

  </svg>

  <script>
    const rightArm = document.getElementById("rightArm");
    const dosa = document.getElementById("dosa");
    const ring1 = document.getElementById("dosaRing1");
    const ring2 = document.getElementById("dosaRing2");
    const steam = document.getElementById("steam");
    const masala = document.getElementById("masala");
    const plateArea = document.getElementById("plateArea");
    const caption = document.getElementById("caption");

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    window.setFrame = function(t) {
      const total = 8;
      const p = clamp(t / total, 0, 1);

      // smoother arm motion
      let angle = 0;
      if (t < 2) {
        angle = 18 + Math.sin(t * 5) * 10;
      } else if (t < 4) {
        angle = -10 + Math.sin(t * 7) * 18;
      } else if (t < 6) {
        angle = 10 + Math.sin(t * 4) * 6;
      } else {
        angle = 20 + Math.sin(t * 3) * 8;
      }
      rightArm.setAttribute("transform", `translate(312 368) rotate(${angle})`);

      // dosa growth
      const grow = clamp(t / 3, 0, 1);
      const rx = 45 + grow * 125;
      const ry = 14 + grow * 34;
      dosa.setAttribute("rx", rx.toFixed(2));
      dosa.setAttribute("ry", ry.toFixed(2));

      ring1.setAttribute("rx", Math.max(0, rx - 18).toFixed(2));
      ring1.setAttribute("ry", Math.max(0, ry - 5).toFixed(2));
      ring2.setAttribute("rx", Math.max(0, rx - 42).toFixed(2));
      ring2.setAttribute("ry", Math.max(0, ry - 12).toFixed(2));

      // dosa color change while cooking
      if (t < 2) {
        dosa.setAttribute("fill", "#fdf7ea");
      } else if (t < 4) {
        dosa.setAttribute("fill", "#f6dfa8");
      } else if (t < 6) {
        dosa.setAttribute("fill", "#efc977");
      } else {
        dosa.setAttribute("fill", "#e4b15b");
      }

      // steam
      if (t >= 3) {
        steam.setAttribute("opacity", (0.25 + Math.abs(Math.sin(t * 2)) * 0.45).toFixed(2));
        const rise = (t * 18) % 45;
        steam.setAttribute("transform", `translate(0 ${-rise})`);
      } else {
        steam.setAttribute("opacity", "0");
      }

      // masala appearance
      if (t >= 5 && t < 6.5) {
        masala.setAttribute("opacity", "1");
      } else if (t >= 6.5) {
        masala.setAttribute("opacity", "0");
      } else {
        masala.setAttribute("opacity", "0");
      }

      // final serving plate
      if (t >= 6.2) {
        plateArea.setAttribute("opacity", "1");
      } else {
        plateArea.setAttribute("opacity", "0");
      }

      // captions
      if (t < 2) {
        caption.textContent = "Step 1: Pour the dosa batter onto the hot tawa!";
      } else if (t < 4) {
        caption.textContent = "Step 2: Spread the batter in a nice big circle!";
      } else if (t < 5.5) {
        caption.textContent = "Step 3: Let the dosa cook until golden and tasty!";
      } else if (t < 6.7) {
        caption.textContent = "Step 4: Add the yummy potato masala filling!";
      } else {
        caption.textContent = "Step 5: Serve the crispy masala dosa with chutney and sambar!";
      }
    };

    window.setFrame(0);
  </script>
</body>
</html>
