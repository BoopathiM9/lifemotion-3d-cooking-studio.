<header>LIFEMOTION / AI KIDS</header><h1>Chef Maya's dosa kitchen</h1><div id="step"></div><div id="hint">A little lesson. A delicious discovery. • Cook with a grown-up</div><div id="label">CHEF MAYA</div><div id="caption"></div><div id="progress"></div>

const $=id=>document.getElementById(id), clamp=v=>Math.max(0,Math.min(1,v)), mix=(a,b,p)=>a+(b-a)*clamp(p);
const attr=(id,key,value)=>$(id).setAttribute(key,value), show=(id,on)=>attr(id,'opacity',on?1:0);
for(let i=1;i<6;i++) $('rings').innerHTML+=`<ellipse cx="755" cy="427" rx="${i*27}" ry="${i*7.7}"/>`;
window.setFrame=function(t){
 const data=window.LESSON;if(!data)throw Error('Run narration first');
 const s=data.steps.find(s=>t>=s.start&&t<s.end)||data.steps.at(-1), k=s.key,p=clamp((t-s.start)/(s.speechEnd-s.start)), idx=data.steps.indexOf(s);
 $('step').textContent=s.title; $('caption').textContent=data.captions.find(c=>t>=c.start&&t<c.end)?.text||''; $('progress').style.width=clamp(t/data.duration)*1280+'px';
 const amp=data.envelope[Math.floor(t/.02)]||0, word=data.words.find(w=>t>=w.start&&t<w.end), rounded=word&&/[ou]/i.test(word.text), speaking=amp>.045;
 attr('mouthHole','rx',speaking?(rounded?11:19):18);attr('mouthHole','ry',speaking?3+amp*13:2);show('tongue',speaking&&amp>.3);show('smile',!speaking);
 attr('eyes','transform',`translate(0 ${247*(1-(t%3.7<.13?.12:1))}) scale(1 ${t%3.7<.13?.12:1})`);
 let x=447,y=378,tool='ladle';
 if(k==='pour'){x=mix(458,755,Math.min(1,p*2));y=mix(520,353,Math.min(1,p*2));}
 if(k==='spread'){const a=p*Math.PI*8,r=18+120*p;x=755+Math.cos(a)*r;y=427+Math.sin(a)*r*.28;}
 if(k==='cook'){x=755+Math.cos(p*6.28)*178;y=427+Math.sin(p*6.28)*48-25;}
 if(k==='fill'){x=mix(595,695,p*2);y=mix(535,391,p*2)-Math.sin(p*Math.PI)*45;}
 if(k==='fold'){tool='spatula';x=mix(920,680,p);y=433-Math.sin(p*Math.PI)*68;}
 if(k==='serve'){tool='spatula';x=mix(755,1100,p*2);y=mix(432,537,p*2)-Math.sin(Math.min(1,p*2)*Math.PI)*45;}
 const shift=idx<3?0:k==='pour'?mix(0,210,p*3):k==='serve'?mix(210,430,p*2):210; attr('chef','transform','translate('+shift+' 0)'); x-=shift; let hx=x-95,hy=y-44; attr('arm','d',`M324 359Q${hx-70} ${hy-35} ${hx} ${hy}`);attr('hand','cx',hx);attr('hand','cy',hy);attr('handle','d',`M${hx} ${hy}L${x} ${y}`);attr('ladle','cx',x);attr('ladle','cy',y);attr('spatula','transform',`translate(${x} ${y})`);show('ladle',tool==='ladle');show('spatula',tool==='spatula');
 const pouring=k==='pour'&&p>.48&&p<.88;show('stream',pouring);attr('stream','d',`M${x} ${y+5}Q${x+5} 390 ${755-shift} 427`);
 const growth=k==='pour'?clamp((p-.48)/.4)*.25:k==='spread'?mix(.25,1,p):idx>4?1:0;
 show('food',growth>0);attr('dosa','rx',170*growth);attr('dosa','ry',48*growth);attr('dosa','fill',idx>=5?`rgb(${Math.round(mix(255,235,k==='cook'?p:1))},${Math.round(mix(239,185,k==='cook'?p:1))},${Math.round(mix(209,91,k==='cook'?p:1))})`:'#fff0d1');
 attr('rings','transform',`translate(${755*(1-growth)} ${427*(1-growth)}) scale(${growth})`);show('rings',idx>=4);show('filling',idx===6&&p>.4||idx===7&&p<.55);show('dosa',idx<7||idx===7&&p<.5);show('rings',idx>=4&&(idx<7||idx===7&&p<.5));show('folded',idx===7&&p>=.5||idx===8);
 if(k==='fold')attr('folded','transform',`translate(0 ${-Math.sin(clamp((p-.5)*2)*Math.PI)*27})`);else attr('folded','transform','');
 attr('food','transform',k==='serve'?`translate(${x+shift-755} ${y-432}) translate(755 427) scale(.7) translate(-755 -427)`:'');
 show('steam',idx>=5&&idx<=7);attr('steam','transform',`translate(0 ${-(t*18%35)})`);attr('steam','opacity',idx>=5&&idx<=7?.25+Math.sin(t*3)**2*.35:0);
 show('oil',k==='cook'&&p<.7);attr('oil','cx',x);attr('oil','cy',y+18);
 window.frameState={key:k,caption:$('caption').textContent,mouth:amp,tool,x,y};
};if(window.LESSON)window.setFrame(0);
