const $=id=>document.getElementById(id), clamp=v=>Math.max(0,Math.min(1,v)), mix=(a,b,p)=>a+(b-a)*clamp(p);

 const blink=1-Math.sin(clamp((t%4.3)/.2)*Math.PI)*.96; const eyescale=(k==='serve'&&p>.7)?.8:blink; attr('eyes','transform',`translate(0 ${249*(1-eyescale)}) scale(1 ${eyescale})`); attr('gaze','transform',`translate(${idx>=3&&idx<8?3:Math.sin(t*.8)} 0)`);

  if(step==='fold'){tool='spatula';const insert=ease(e/1.9),lift=ease((e-3.35)/1.25),fold=ease((e-4.75)/1.15);x=mix(845,835,insert);y=mix(355,423,insert);x=mix(x,755,fold);y-=Math.sin(lift*Math.PI*.5)*25*(1-fold);shift=280;}
